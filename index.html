<!doctype html>
<html lang="tr">
<head>

<title>Boğaz Vapuru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230E7490%27/%3E%3Cpath d=%27M4 20h24l-3 6H7z%27 fill=%27%23fff%27/%3E%3Crect x=%279%27 y=%2713%27 width=%2714%27 height=%277%27 rx=%271%27 fill=%27%23fff%27/%3E%3Crect x=%2714%27 y=%277%27 width=%274%27 height=%277%27 fill=%27%23FACC15%27/%3E%3Crect x=%2714%27 y=%277%27 width=%274%27 height=%272%27 fill=%27%23222%27/%3E%3C/svg%3E">
<style>
:root{
  --accent:#0E7490; --accent-l:#22b8d9; --accent-d:#095566; --ink:#f3f8fa; --dim:#a9c2cb;
  --glass:rgba(8,28,38,.62); --glass-b:rgba(255,255,255,.14); --bad:#ff7a66; --good:#7fe3a0; --warn:#ffd25a;
  --r:16px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1d26;color:var(--ink);
  font:700 var(--fs)/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor;stroke:none}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-b);
  border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent-l);outline-offset:2px}
.btn{min-height:44px;min-width:44px;padding:10px 20px;border-radius:14px;border:2px solid var(--glass-b);background:rgba(255,255,255,.08);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.2px;transition:transform .08s,background .15s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:#8fe0f2;box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:hover{background:#1289a8}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{padding:0;width:44px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:none}
#topbar{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;padding:6px 10px;pointer-events:auto}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:1px;color:var(--accent-l);margin-right:4px}
#topbar .brand svg{width:36px;height:30px}
.stat{display:flex;flex-direction:column;align-items:flex-start;min-width:54px;line-height:1.1}
.stat small{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.stat small svg.ic{width:12px;height:12px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b em{font-style:normal;font-size:12px;color:var(--dim);margin-left:4px}
.stat b.late{color:var(--bad)}.stat b.early{color:var(--good)}
.stat.wide{min-width:96px}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;width:100%;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent-l);width:0;transition:width .2s}
.bar.comfort i{background:linear-gradient(90deg,#ff6b5e,#ffd25a 50%,#7fe3a0)}
.bar.hull i{background:linear-gradient(90deg,#7fe3a0,#ffd25a 55%,#ff6b5e)}
#topbar .btns{margin-left:auto;display:flex;gap:6px}
.stars-sm{display:flex;gap:2px}
.stars-sm svg{width:16px;height:16px;fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.3);stroke-width:1.5}
.stars-sm svg.on{fill:var(--warn);stroke:#fff3b0}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--barh,56px) + max(8px,env(safe-area-inset-top)) + 8px);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,520px)}
.toast{padding:8px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);font-weight:800;text-align:center;animation:tin .25s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.good{border-color:var(--good);color:#dbffe6}.toast.bad{border-color:var(--bad);color:#ffddd6}.toast.info{border-color:var(--accent-l);color:var(--ink)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
#minimap{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:150px;height:230px;border-radius:14px;border:1px solid var(--glass-b);box-shadow:0 8px 24px rgba(0,0,0,.28);background:rgba(8,28,38,.55);pointer-events:auto}
#nextCard{position:absolute;left:max(8px,env(safe-area-inset-left));top:calc(var(--barh,56px) + max(8px,env(safe-area-inset-top)) + 8px);padding:8px 12px;min-width:170px;line-height:1.2}
#nextCard small{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
#nextCard b{font-size:19px;color:var(--accent-l)}
#nextCard .l2{font-size:12.5px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
#nextCard .l2 span{color:var(--dim)}
#nextCard .l2.late{color:var(--bad)}
#gauges{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#speedo{width:116px;height:116px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);position:relative}
#speedo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
#speedo circle{fill:none;stroke-width:8;stroke-linecap:round}
#spArc{stroke:var(--accent-l)}#spArc.astern{stroke:var(--bad)}
#speedo div{text-align:center;line-height:1}
#speedo b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
#speedo small{font-size:10px;color:var(--dim)}
#levers{display:flex;gap:6px;align-items:flex-end}
.lever{width:34px;height:88px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);position:relative;overflow:hidden}
.lever i{position:absolute;left:4px;right:4px;border-radius:6px;background:var(--accent-l)}
.lever.rud i{top:4px;bottom:4px;width:8px;left:50%}
.lever small{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:9px;color:var(--dim)}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 8px);display:none;padding:8px 14px;min-width:260px;text-align:center}
#dock.show{display:block}
#dock .row3{display:flex;gap:14px;justify-content:center}
#dock .g{display:flex;flex-direction:column;align-items:center;min-width:64px}
#dock .g small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
#dock .g b{font-size:20px;font-variant-numeric:tabular-nums}
#dock .g b.ok{color:var(--good)}#dock .g b.no{color:var(--bad)}
#dock .hint{font-size:12px;color:var(--warn);margin-top:4px;min-height:14px}
#dock .hint.ok{color:var(--good)}
#camLbl{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(var(--barh,56px) + max(8px,env(safe-area-inset-top)) + 8px);padding:4px 10px;font-size:11px;color:var(--dim)}
#floaters{position:absolute;inset:0;overflow:hidden}
.floater{position:absolute;font-weight:900;font-size:20px;color:var(--good);text-shadow:0 2px 0 rgba(0,0,0,.55);animation:fup 1.4s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.floater.neg{color:var(--bad)}
@keyframes fup{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-70px}}
/* touch */
#touch{position:absolute;inset:0;display:none}
body.touch #touch{display:block}
#tThr{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:72px;height:210px;border-radius:36px;pointer-events:auto;touch-action:none}
#tThr::before{content:"";position:absolute;left:50%;top:18px;bottom:18px;width:4px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.28)}
#tThr u{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.4)}
#tThr i{position:absolute;left:10px;width:52px;height:52px;top:50%;margin-top:-26px;border-radius:50%;background:var(--accent-l);box-shadow:0 4px 0 var(--accent-d);display:flex;align-items:center;justify-content:center;color:#062a33}
#tThr small{position:absolute;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
#tWheel{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center}
#tWheel svg{width:132px;height:132px;transition:transform .06s linear;color:var(--accent-l)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid var(--glass-b);width:60px;height:52px}
.tb.on{background:rgba(34,184,217,.35);border-color:var(--accent-l)}
#tHorn{right:calc(max(14px,env(safe-area-inset-right)) + 84px);bottom:max(14px,env(safe-area-inset-bottom))}
#tCam{right:calc(max(14px,env(safe-area-inset-right)) + 84px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px)}
body.touch #minimap{bottom:auto;top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 96px);width:100px;height:150px}
body.touch #gauges{bottom:auto;right:max(8px,env(safe-area-inset-right));top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 34px)}
body.touch #speedo{width:70px;height:70px}body.touch #speedo b{font-size:19px}body.touch #speedo small{font-size:8px}
body.touch #levers{display:none}
body.touch #camLbl{display:none}
body.touch #nextCard{min-width:0;padding:6px 10px}#nextCard b{font-size:16px}
body.touch #dock{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 124px);min-width:200px;padding:6px 10px}
body.touch #dock .g b{font-size:16px}
body.touch #toasts{top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 12px)}
@media (orientation:portrait){body.touch #toasts{top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 70px)}body.touch #dock{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 220px)}}
/* screens */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:12px;overflow:auto;touch-action:pan-y}
.screen.show{display:flex}
.screen.dim{background:rgba(5,14,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{width:min(92vw,540px);padding:22px 24px;text-align:center;max-height:96vh;overflow:auto}
.card h1{margin:6px 0 2px;font-size:40px;letter-spacing:3px;color:var(--accent-l);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.card h2{margin:4px 0 8px;font-size:26px;color:var(--accent-l)}
.card p{margin:6px 0;color:#e6eff3;font-weight:600}
.card .sub{color:var(--ink);font-size:17px}
.card .how{font-size:13.5px;color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:stretch}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#logoBig{width:200px;height:120px;margin:0 auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.best{font-size:13px;color:var(--dim);margin-top:10px}
.foot{margin-top:14px;font-size:12px;color:var(--dim)}
.foot a{color:var(--accent-l);text-decoration:none;border-bottom:1px dotted var(--accent-l)}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;text-align:left;margin-top:10px}
.set label{font-weight:800}
.set output{width:42px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;accent-color:var(--accent-l);background:transparent}
.seg{display:flex;gap:6px;grid-column:2/4}
.seg .btn{flex:1;padding:8px 10px}
.seg .btn.sel{background:var(--accent);color:#fff;border-color:#8fe0f2}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars svg{width:46px;height:46px;fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.3);stroke-width:1.5}
.stars svg.on{fill:var(--warn);stroke:#fff3b0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;text-align:left;margin:10px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07)}
.kv span:nth-child(odd){color:var(--dim)}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.kv .neg{color:var(--bad)}.kv .pos{color:var(--good)}
.rec{color:var(--warn);font-weight:900;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
ul.feat{list-style:none;padding:0;margin:8px 0;text-align:left}
ul.feat li{padding:5px 10px;margin:4px 0;border-radius:10px;background:rgba(255,255,255,.07);font-size:14px}
ul.feat li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-l);margin-right:8px}
/* campaign map */
#cmap{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.cnode{width:52px;height:56px;border-radius:12px;border:2px solid var(--glass-b);background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-size:14px}
.cnode.sel{border-color:var(--accent-l);background:rgba(34,184,217,.2)}
.cnode.lock{opacity:.4}
.cnode .stars-sm svg{width:12px;height:12px}
.cnode.endless{width:64px}
.timetable{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;text-align:left;font-size:13px;margin:8px 0;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07)}
.timetable span:nth-child(3n+1){color:var(--dim);font-variant-numeric:tabular-nums}
.timetable span:nth-child(3n){color:var(--accent-l);font-variant-numeric:tabular-nums}
.cond{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.cond span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(34,184,217,.18);border:1px solid rgba(34,184,217,.4)}
#dbg{position:fixed;left:8px;top:120px;z-index:50;font:12px/1.35 monospace;color:#9fffa8;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none;display:none;max-width:70vw}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,10,20,.4));opacity:.9}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 90px 20px rgba(255,60,40,.8);opacity:0;transition:opacity .35s}
@media (max-width:960px){
  :root{--fs:13px}
  #topbar{gap:6px;padding:5px 7px;flex-wrap:wrap}
  #topbar .brand span{display:none}
  .stat b{font-size:14px}.stat small{font-size:9px}
  .stat.wide{min-width:72px}
  .card h1{font-size:30px}
  #minimap{width:110px;height:168px}
  #speedo{width:92px;height:92px}#speedo b{font-size:22px}
  .lever{height:70px}
}
@media (max-height:520px){
  .card{padding:12px 16px}.card h1{font-size:28px}#logoBig{width:130px;height:78px}
  #minimap{width:100px;height:150px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

    const pinned = Math.abs(P.u) < 0.4 && latRel < 8 && Math.abs(rem) < 30 && !(latRel < 3.0 && Math.abs(along) < 11);
    BOT.pinT = pinned ? BOT.pinT + dt : 0;
    if (!BOT.back && (BOT.pinT > 6 || (latRel > 6 && rem < 1.6 * latRel && rem > -8 && Math.abs(P.u) < 1.6))) { BOT.back = true; BOT.pinT = 0; }
    BOT.noOutT = Math.max(0, (BOT.noOutT || 0) - dt);
    if (!BOT.back && lat < 0.5 && rem > -5 && rem < 100 && BOT.noOutT <= 0) { BOT.back = true; BOT.backOut = true; }
    if (!BOT.back && rem < -12 && rem > -60 && latRel < 40) BOT.back = true;   // drifted past the berth: back up along the lane
    if (BOT.back) {
      // back straight out along the berth (bow a little towards the pier so the stern swings out), then come in again
      const done = BOT.backOut ? (lat > 6 && rem > 60) || rem > 120 : (rem > 4 * Math.max(latRel, 2) + 20 || rem > 90);
      if (done) { if (BOT.backOut) BOT.noOutT = 25; BOT.back = false; BOT.backOut = false; }
      else { vT = -1.2; alignHd = wrapAng(ah - 0.3 * outwardSign(Pr, ah)); aimX = P.x - Math.sin(ah) * 30; aimZ = P.z - Math.cos(ah) * 30; }
    }
    if (!BOT.back) {
      if (latRel < 3.0 && Math.abs(along) < 11) { vT = 0; alignHd = ah; aimX = Pr.bx; aimZ = Pr.bz; }                      // hold alongside
      else if (inLane) {
        // carrot on the berth line ahead of the ferry: the approach angle stays under ~24 degrees, parallel near the pier
        const inside = lat < -1.5 && rem > 30;
        const ahead = 40, aimLat = (inside ? lat + 12 : Math.min(slope, lat + 14)) + FERRY.beam / 2, aimAlong = along + dir * ahead;
        aimX = Pr.ex + Pr.nx * aimLat + Pr.tx * aimAlong; aimZ = Pr.ez + Pr.nz * aimLat + Pr.tz * aimAlong;
        vT = Math.min(inside ? 1.5 : 4.5, Math.sqrt(2 * 0.28 * Math.max(rem - 1, 0)) + 0.3);
        if (latRel < 3) { alignHd = ah; vT = Math.min(vT, 2.2); }
        if (rem < -6) vT = -0.5; else if (rem < 3 && latRel >= 3.0) vT = Math.max(vT, 0.6);
      } else {
        // not in the lane: go round by the line-up point (or straight to the approach point when it is ahead of us)
        const apX = Pr.bx + Pr.nx * 35 - Pr.tx * dir * 180, apZ = Pr.bz + Pr.nz * 35 - Pr.tz * dir * 180;
        const dAP = hyp(apX - P.x, apZ - P.z), usePre = rem < 150 || dAP < 50 || Math.abs(hdErr) > 1.3;
        aimX = usePre ? preX : apX; aimZ = usePre ? preZ : apZ;
        if (lat < 15 && Math.abs(rem) < 70) { aimX = P.x + Pr.nx * 50 - Pr.tx * dir * 30; aimZ = P.z + Pr.nz * 50 - Pr.tz * dir * 30; }   // next to the pier: get clear of it first
        if (!clearLine(P.x, P.z, aimX, aimZ, 10)) { BOT.near = false; BOT.wp = []; BOT.wpFor = null; input.throttle = 0; return; }        // land in the way: plan a route instead
        const dd = hyp(aimX - P.x, aimZ - P.z);
        vT = Math.min(7, Math.sqrt(2 * 0.3 * Math.max(dd - 15, 0)) + 2.0);
        if (rem > -40 && rem < 60 && latRel < 25) vT = Math.min(vT, 2.5);   // close to the pier: no speed
      }
    }
  } else { aimX = tg[0]; aimZ = tg[1]; vT = Math.min(FERRY.maxV * 0.92, Math.sqrt(2 * 0.3 * Math.max(d - 20, 0)) + 2.5); BOT.finalT = 0; }
  // compensate the current and wind: steer the water-relative velocity, not the ground track
  currentAt(P.x, P.z, _v);
  const wantX = aimX - P.x, wantZ = aimZ - P.z, wl = hyp(wantX, wantZ) || 1;
  const vv = Math.max(Math.abs(vT), 2.5);
  let hdWant = alignHd !== null && (Math.abs(vT) < 0.8 || BOT.back) ? alignHd : Math.atan2(wantX / wl * vv - _v.x - SIM.wind.x * 0.3, wantZ / wl * vv - _v.z - SIM.wind.z * 0.3);
  if (alignHd !== null && Math.abs(vT) >= 0.8 && !BOT.back) { // blend towards parallel while still moving in
    const a = wrapAng(alignHd - hdWant); hdWant = wrapAng(hdWant + a * 0.6);
  }
  // traffic ahead: slow down, stop, horn at fishing boats
  const gap = aheadGap(BOT_SELF, 0.5, 150);
  if (gap < 1e8) vT = Math.min(vT, Math.sqrt(2 * 0.3 * Math.max(gap - 14, 0)));
  // crossing traffic: closest point of approach within the next 18 s too close -> slow down or hold
  const cpa = closestApproach(P.x, P.z, P.vx, P.vz, 18, null);
  if (cpa.d < 30 + cpa.len / 2) vT = Math.min(vT, cpa.t < 8 ? 0.4 : 2.5);
  BOT.hornT -= dt; if (gap < 70 && BOT.hornT <= 0) { BOT.hornT = 6; input.horn = true; }
  const s = Math.sin(P.hd), c = Math.cos(P.hd), look = 25 + Math.abs(P.u) * 6;
  // something parked ahead for a while: go around it (a detour waypoint to the deeper side), unless we are alongside already
  if (gap < 30 && Math.abs(P.u) < 0.8 && !(final && latRel < 6)) BOT.blockT += dt; else BOT.blockT = 0;
  if (BOT.blockT > 6 && !BOT.detour) {
    BOT.blockT = 0; BOT.detour = true;
    const side = depth(P.x + c * 45, P.z - s * 45) >= depth(P.x - c * 45, P.z + s * 45) ? 1 : -1;
    BOT.wp.unshift([P.x + s * 25 + c * side * 45, P.z + c * 25 - s * side * 45]);
    if (gap < 12) BOT.rev = 2.5;     // touching: back off first
  }
  if (BOT.detour && BOT.blockT > 3) vT = Math.max(vT, 1.0);   // creep out of a deadlock towards the detour point
  // land ahead? look along the heading, slow if shallow
  if (depth(P.x + s * look, P.z + c * look) < 18 && !final) vT = Math.min(vT, 2.5);
  // rudder: proportional on the heading error with yaw-rate damping; no steering while going astern
  const err = wrapAng(hdWant - P.hd), maxRud = P.u > 7.5 ? 0.75 : 1;   // gentle on the rudder at speed (comfort)
  input.rudder = P.u < -0.3 ? clamp(-err * 1.5, -0.5, 0.5) : clamp(err * 2.6 - P.r * 5, -maxRud, maxRud);
  // throttle: ground-speed target turned into a surge target (hold against the current), astern to brake
  const curAlong = -((_v.x + SIM.wind.x * 0.3) * s + (_v.z + SIM.wind.z * 0.3) * c);
  // progress boost: when the ferry is not closing on its aim (wind or current holding it off), push harder for a while
  const closing = ((aimX - P.x) * P.vx + (aimZ - P.z) * P.vz) / (hyp(aimX - P.x, aimZ - P.z) || 1);
  if (vT > 0.2 && closing < 0.25 && !BOT.back) { BOT.slowT = (BOT.slowT || 0) + dt; if (BOT.slowT > 4) { BOT.boost = Math.min(2.5, (BOT.boost || 0) + 0.5); BOT.slowT = 0; } }
  else if (closing > 0.8 || vT <= 0.2) { BOT.slowT = 0; BOT.boost = Math.max(0, (BOT.boost || 0) - dt * 0.3); }
  if (vT > 0.2 && BOT.boost > 0) vT += BOT.boost;
  const e = (vT + (Math.abs(vT) < 2.5 ? curAlong : 0)) - P.u;
  input.throttle = e > 0 ? clamp(e * 0.45, 0, 1) : clamp(e * 0.7, -1, 0);
  if (vT === 0 && Math.abs(P.u) < 0.15) input.throttle = 0;
  BOT.dbg = { boost: +(BOT.boost||0).toFixed(1), back: BOT.back, out: BOT.backOut, lane: inLane, pin: +BOT.pinT.toFixed(1), rem: +rem.toFixed(0), hdErr: Math.round(hdErr * 57.3), final, vT: +vT.toFixed(2), hdWant: Math.round(hdWant * 57.3), hd: Math.round(P.hd * 57.3), err: Math.round(err * 57.3), rud: +input.rudder.toFixed(2), thr: +input.throttle.toFixed(2), lat: +lat.toFixed(1), along: +along.toFixed(1), dir: BOT.dockDir, gap, d: Math.round(d) };
  // stuck: no progress for a while -> back out and plan again
  if (Math.abs(P.u) < 0.25 && Math.abs(vT) > 0.5) BOT.stuck += dt; else BOT.stuck = 0;
  if (BOT.stuck > 8) { BOT.stuck = 0; BOT.rev = 3; BOT.wp = []; }
}

// ---------------------------------------------------------------- main loop
let lastT = performance.now(), acc = 0, fpsS = 60, frameN = 0, ambT = 8;
const FIXED = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.1);
  if (document.hidden) return;
  if (G.state === 'loading') return;
  fpsS += (1 / Math.max(dt, 1e-3) - fpsS) * 0.05;
  if (G.state === 'play') { if (FLAG.auto) botTick(dt); else readInput(dt); }
  else if (FLAG.auto) botTick(dt);
  if (G.state === 'play' || G.state === 'title') {
    acc += dt; let n = 0;
    while (acc >= FIXED && n < 4) { if (G.state === 'play') stepSim(FIXED); else stepTitle(FIXED); acc -= FIXED; n++; }
    if (acc > FIXED * 4) acc = 0;
  }
  const active = G.state === 'play';
  if (active && input.horn && !player.horn) { player.horn = true; AUD.hornStart(); } else if ((!input.horn || !active) && player.horn) { player.horn = false; AUD.hornStop(); }
  AUD.update(Math.abs(player.thr), player.speed, SIM.swell, SIM.wind.a * (SIM.storm ? 1 : 0.4), SIM.rain, active);
  if (active) { ambT -= dt; if (ambT <= 0) { ambT = 12 + Math.random() * 20; if (Math.random() < 0.4) AUD.hornFar(0.04); } }
  syncRender(G.state === 'paused' ? 0 : dt);
  if (active || G.state === 'paused') { updateHUD(dt); if ((frameN++ & 1) === 0) drawMinimap(); }
  renderer.render(scene, camera);
  if (FLAG.debug) debugOverlay();
}
function stepTitle(dt) { SIM.t += dt; stepTraffic(dt); stepWalkers(dt); for (const id of Object.keys(PIERS)) PIERS[id].wait = Math.min(40, PIERS[id].wait + 0.2 * dt); }
function debugOverlay() {
  const i = renderer.info.render, ns = nextStop();
  el.dbg.style.display = 'block';
  el.dbg.textContent = 'fps ' + fpsS.toFixed(0) + ' · calls ' + i.calls + ' · tris ' + i.triangles + ' · pts ' + i.points + '\n' +
    'state ' + G.state + ' · shift ' + (SIM.shift ? SIM.shift.id : '-') + ' · t ' + SIM.t.toFixed(1) + ' · ' + fmtClock(SIM.hour) + ' · score ' + shiftScore() + '/' + SIM.target + '\n' +
    'pos ' + player.x.toFixed(0) + ',' + player.z.toFixed(0) + ' hd ' + (player.hd * 180 / Math.PI).toFixed(0) + ' u ' + player.u.toFixed(2) + ' spd ' + player.speed.toFixed(2) + ' thr ' + player.thr.toFixed(2) + ' rud ' + player.rud.toFixed(2) + '\n' +
    'next ' + (ns ? ns.id + ' (' + SIM.stopIdx + '/' + (SIM.stops.length - 1) + ')' : '-') + ' docked ' + (SIM.docked ? SIM.docked.id : '-') + ' gap ' + DOCK.gap.toFixed(1) + ' along ' + DOCK.along.toFixed(1) + ' ang ' + (DOCK.ang * 57.3).toFixed(0) + '\n' +
    'aboard ' + SIM.aboardN + ' delivered ' + SIM.delivered + ' lost ' + SIM.lost + ' comfort ' + SIM.comfort.toFixed(0) + ' hull ' + player.hull.toFixed(0) + ' traffic ' + SIM.traffic.length + ' walkers ' + SIM.walkers.length + '\n' +
    'bot wp ' + BOT.wp.length + ' stuck ' + BOT.stuck.toFixed(1) + ' · assets ' + ASSETS.loaded.length + '/' + (ASSETS.loaded.length + ASSETS.failed.length) + '\n' +
    'results ' + G.log.map(r => r.shift + ':' + r.stars + '★/' + r.score).join(' ') + (G.done ? (G.failed ? ' · FAILED' : ' · DONE') : '') + '\n' +
    'errors ' + G.errors.length + (G.errors.length ? '\n' + G.errors.slice(-3).join('\n') : '');
}
window.addEventListener('error', e => { G.errors.push((e.message || 'error') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')); });
window.addEventListener('unhandledrejection', e => { G.errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });

// fast-forward without rendering
window.vapurSim = function (seconds) {
  const dt = 1 / 30, n = Math.round(seconds / dt);
  for (let i = 0; i < n; i++) {
    if (G.done) break;
    if (FLAG.auto) botTick(dt); else if (G.state === 'play') readInput(dt);
    if (G.state === 'play') stepSim(dt); else if (G.state === 'title') stepTitle(dt);
  }
  return window.vapur;
};
window.vapur = {
  G, SIM, player, input, AUD, STR, WORLD, PIERS, SHIFTS, ASSETS, DOCK, BOT, scene, renderer, camera,
  get state() { return G.state; }, get shift() { return SIM.shift && SIM.shift.id; }, get time() { return SIM.t; }, get hour() { return SIM.hour; },
  get score() { return shiftScore(); }, get target() { return SIM.target; }, get aboard() { return SIM.aboardN; }, get delivered() { return SIM.delivered; },
  get hull() { return player.hull; }, get comfort() { return SIM.comfort; }, get log() { return G.log; }, get done() { return G.done; }, get errors() { return G.errors; },
  get assets() { return { loaded: ASSETS.loaded.slice(), failed: ASSETS.failed.slice() }; },
  start(n) { G.mode = 'campaign'; G.shiftIdx = clamp((n || 1) - 1, 0, 7); G.selIdx = G.shiftIdx; G.retries = 0; G.totals = { score: 0, pax: 0, stars: [] }; beginShift(); },
  setCam: setCamMode,
  get gpu() { try { const gl = renderer.getContext(), e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (err) { return '?'; } },
  stats() { return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, fps: fpsS, traffic: SIM.traffic.length }; },
};

// ---------------------------------------------------------------- boot
let loadN = 0, loadTotal = 8;
async function boot() {
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  const step = async fn => { fn(); loadN++; el.playTxt.textContent = t('loading', loadN, loadTotal); await yieldUI(); };
  setupTouch(); applyLang(); syncSettingsUI();
  WR = mulberry(2024);
  await step(() => { buildPiers(); buildFairway(); });
  await step(() => buildMonuments());
  await step(() => buildBridge());
  await step(() => buildTown());
  await step(() => buildWindowLights());
  await step(() => buildLand());
  await step(() => { buildScene(); applyQuality(); });
  await step(() => { buildMinimapBase(); });
  G.state = 'title'; el.bPlay.disabled = false; el.playTxt.setAttribute('data-i', 'play'); el.playTxt.textContent = t('play'); window.__vapurReady = true; if (!lsGet(KEY_SET)) saveSettings();
  showcase(); applyLang(); updateBestLine();
  if (FLAG.auto || SIM_PRE > 0) {
    if (Q.get('mode') === 'endless') startEndless(); else startCampaign(false);
    beginShift();
    if (SIM_PRE > 0) window.vapurSim(SIM_PRE);
    lastSkyHour = -99;
  }
  lastT = performance.now(); requestAnimationFrame(frame);
  setTimeout(loadAssets, 80);
}
boot().catch(err => { G.errors.push('boot: ' + (err && err.stack || err)); const m = document.getElementById('playTxt'); if (m) m.textContent = 'Error: ' + (err && err.message); console.error(err); if (el.dbg) { el.dbg.style.display = 'block'; el.dbg.textContent = String(err && err.stack || err); } });
</script>
