<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Boğaz Vapuru · oyun şarkısı stili / song-video style</title>
<desc id="d">Banner for Boğaz Vapuru in the style of its song video: navy ground, golden title, cream serif lettering, a white ferry with a yellow stripe and funnel on a blue strait at sunset, a captain in a white cap and a child in a red-and-white striped shirt holding a simit, seagulls.</desc>
<defs>
<clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E0D0"/><stop offset="1" stop-color="#F0B038" stop-opacity=".55"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#103858"/><stop offset=".6" stop-color="#103858" stop-opacity=".93"/><stop offset="1" stop-color="#103858" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="#103858"/>
<rect x="600" width="680" height="200" fill="url(#sky)"/>
<!-- bridge and shore -->
<g fill="#8a7a78" opacity=".8"><rect x="660" y="120" width="560" height="6"/><rect x="740" y="84" width="8" height="70"/><rect x="1100" y="84" width="8" height="70"/></g>
<g fill="#b89880" opacity=".9"><rect x="1150" y="146" width="40" height="52"/><rect x="1196" y="132" width="34" height="66"/><rect x="1236" y="150" width="44" height="48"/></g>
<!-- sea -->
<rect y="198" width="1280" height="122" fill="#104878"/>
<g stroke="#F8F8E8" stroke-width="2" opacity=".25" fill="none"><path d="M620 236 h300"/><path d="M700 262 h340"/><path d="M640 290 h400"/></g>
<!-- ferry -->
<g>
<path d="M830 262 h330 l-26 36 h-282 z" fill="#F8F8E8"/>
<rect x="846" y="236" width="296" height="30" rx="6" fill="#F8F8E8"/>
<rect x="866" y="244" width="30" height="14" rx="3" fill="#103858"/><rect x="906" y="244" width="30" height="14" rx="3" fill="#103858"/><rect x="946" y="244" width="30" height="14" rx="3" fill="#103858"/>
<path d="M828 276 q166 26 336 0" stroke="#F0B038" stroke-width="5" fill="none"/>
<rect x="1014" y="196" width="36" height="46" rx="4" fill="#F0B038"/><rect x="1014" y="196" width="36" height="12" rx="3" fill="#281808"/>
<rect x="1100" y="214" width="3" height="24" fill="#F8F8E8"/><path d="M1103 214 h18 v12 h-18 z" fill="#A82028"/>
<!-- captain -->
<circle cx="900" cy="220" r="16" fill="#D89068"/><path d="M880 212 q20 -22 40 0 z" fill="#F8F8E8"/><rect x="884" y="210" width="32" height="5" fill="#103858"/><circle cx="900" cy="204" r="3" fill="#F0B038"/>
<circle cx="894" cy="222" r="2.4" fill="#281808"/><circle cx="906" cy="222" r="2.4" fill="#281808"/>
<rect x="884" y="234" width="32" height="8" rx="3" fill="#103858"/>
<!-- child -->
<circle cx="970" cy="222" r="15" fill="#D89068"/><path d="M955 220 q15 -24 30 0 q-15 -6 -30 0 z" fill="#704428"/>
<circle cx="965" cy="224" r="2.4" fill="#281808"/><circle cx="975" cy="224" r="2.4" fill="#281808"/>
<rect x="956" y="236" width="28" height="8" fill="#F8F8E8"/><rect x="956" y="238" width="28" height="2.4" fill="#A82028"/><rect x="956" y="242" width="28" height="2.4" fill="#A82028"/>
<circle cx="998" cy="226" r="9" fill="none" stroke="#C88838" stroke-width="5"/>
</g>
<g fill="none" stroke="#F8F8E8" stroke-width="2.4" stroke-linecap="round" opacity=".9"><path d="M720 80 q10 -10 20 0 q10 -10 20 0"/><path d="M820 56 q8 -8 16 0 q8 -8 16 0"/><path d="M1180 70 q8 -8 16 0 q8 -8 16 0"/></g>
</g>
<rect width="760" height="320" fill="url(#fade)" clip-path="url(#card)"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="56" y="62" font-size="18" letter-spacing="3" fill="#F8F8E8">TURKISH IS EASY… ON A FERRY?</text>
<rect x="56" y="72" width="350" height="3" fill="#A82028"/>
<text x="52" y="162" font-size="78" font-weight="700" letter-spacing="2" fill="#F8F8E8">BOĞAZ VAPURU</text>
<text x="56" y="212" font-size="26" letter-spacing="1" fill="#F0B038">İskeleye yanaş, düdüğü çal</text>
<text x="56" y="254" font-size="20" fill="#F8F8E8" opacity=".9">Eminönü, Kadıköy: sıraya otur!</text>
<rect x="56" y="272" width="214" height="34" rx="17" fill="#F0B038"/>
<text x="163" y="295" font-size="17" font-weight="700" text-anchor="middle" fill="#103858">▶ OYNA · PLAY</text>
<text x="290" y="295" font-size="15" fill="#F8F8E8" opacity=".75">furkiozknn.github.io/bogaz-vapuru</text>
</g>
</svg>
